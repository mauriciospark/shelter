<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelter</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#222819">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#171a12;--pn:#222819;--pn2:#2d3422;--ln:#434d33;--tx:#e6e2cf;--mu:#a0a086;--am:#e3a41d;--gr:#8db04b;--er:#e0513a;--out:#37441f;--in:#2a3120;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e4dfc9;--pn:#d6d0b5;--pn2:#cbc49f;--ln:#9d966f;--tx:#1f2316;--mu:#5c5c43;--am:#9a6200;--gr:#4a6a16;--er:#b3281a;--out:#c5d29a;--in:#ddd7b9;color-scheme:light}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
.mono,h2,.logo,.ph b,.stats,nav button{font-family:"Courier New",Consolas,monospace;text-transform:uppercase;letter-spacing:.08em}
.top{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--pn);border-bottom:3px solid var(--am);background-image:repeating-linear-gradient(135deg,#0000 0 10px,#ffffff0a 10px 20px)}
.logo{font-weight:700;font-size:18px;color:var(--am);line-height:1.1}.logo small{display:block;font-size:10px;color:var(--mu);letter-spacing:.14em}
.stats{flex:1;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--gr);justify-content:flex-end}
.ib{background:none;border:0;color:var(--tx);font-size:22px;line-height:1;padding:6px 8px;cursor:pointer}
.alert{background:var(--er);color:#fff;padding:8px 12px;font-weight:700;cursor:pointer;text-align:center}
#app{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}.pane.on{display:flex}
.ph{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--pn2);border-bottom:1px solid var(--ln);min-height:50px}
.ph b{flex:1;font-size:13px;color:var(--am)}
.sb,.btn{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:3px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn.p,.sb.p{background:var(--am);color:#1a1405;border-color:var(--am);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.body{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;padding:10px 12px;cursor:pointer;align-items:center;border-bottom:1px solid var(--ln)}.row:hover,.row.sel{background:var(--pn)}
.av{width:42px;height:42px;border-radius:4px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none;border:1px solid var(--ln)}
.mid{flex:1;min-width:0}.t{display:flex;justify-content:space-between;gap:8px;align-items:center}.t small{color:var(--mu);font-size:12px}
.pv{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.bd{background:var(--am);color:#1a1405;border-radius:3px;font-size:12px;font-style:normal;min-width:20px;text-align:center;padding:1px 6px;font-weight:700}
.empty{margin:auto;color:var(--mu);padding:24px;text-align:center}
.cc{display:flex;flex-direction:column;flex:1;min-height:0}
.who{flex:1;min-width:0}.who b{display:block;font-weight:600}.who small{color:var(--mu);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:5px;background:var(--bg)}
.b{max-width:82%;padding:6px 9px 4px;border-radius:3px;background:var(--in);border:1px solid var(--ln);overflow-wrap:anywhere}
.b.o{align-self:flex-end;background:var(--out)}.b .sn{display:block;color:var(--am);font-weight:700;font-size:12px}
.sys{align-self:center;color:var(--mu);font-size:12px;border:1px dashed var(--ln);padding:3px 10px;border-radius:3px;text-align:center}
.mt{display:block;text-align:right;color:var(--mu);font-size:11px}
.lc{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--ln);padding:7px 10px;margin-bottom:3px;cursor:pointer}.lc span{font-size:22px}.lc small{display:block;color:var(--mu);font-size:12px}
.vb{display:flex;align-items:center;gap:8px}.vb button{background:var(--am);color:#1a1405;border:0;border-radius:50%;width:32px;height:32px;cursor:pointer}
.att{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px;background:var(--pn);border-top:1px solid var(--ln)}
.bar{display:flex;gap:6px;padding:8px;align-items:center;background:var(--pn2);border-top:1px solid var(--ln)}
.bar input{flex:1;min-width:0;border:1px solid var(--ln);border-radius:3px;padding:10px;font:inherit;background:var(--bg);color:var(--tx)}
.send{background:var(--am);color:#1a1405;border:0;border-radius:3px;width:42px;height:42px;font-size:18px;cursor:pointer;flex:none;font-weight:700}
.mic{touch-action:none;user-select:none;-webkit-user-select:none;border:1px solid var(--ln);border-radius:3px;width:42px;height:42px}.mic.rec{background:var(--er);color:#fff}
.mapw{flex:1;position:relative;min-height:0}.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;background:var(--bg);font:inherit;-webkit-tap-highlight-color:transparent}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}.leaflet-marker-icon{display:block}
.leaflet-container .leaflet-overlay-pane svg,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}svg.leaflet-zoom-animated{will-change:transform}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.nd i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;background:var(--mu);border:2px solid var(--tx);border-radius:2px}
.nd.on i{background:var(--am)}.nd.sos i{background:var(--er);width:22px;height:22px;left:-11px;top:-11px;animation:pl 1.2s infinite}
.nd.s i{outline:2px solid var(--tx);outline-offset:3px}.nd.me i{background:var(--gr);border-radius:50%}
.nd span{position:absolute;left:14px;top:-9px;white-space:nowrap;font:12px Consolas,monospace;color:var(--tx);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 3px var(--bg)}
.nd.fl b{position:absolute;left:-4px;top:-26px;font-size:24px}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:4px;background:var(--pn);color:var(--tx);border:1px solid var(--am)}.leaflet-popup-content{margin:10px 28px 10px 14px;line-height:1.4}.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:var(--pn);border:1px solid var(--am)}.leaflet-popup-close-button{position:absolute;top:0;right:0;padding:4px 8px;color:var(--mu);text-decoration:none;font-size:18px}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-bottom{bottom:0}.leaflet-right{right:0}.leaflet-right .leaflet-control{float:right}
.leaflet-control-attribution{background:var(--pn);color:var(--mu);font-size:11px;padding:0 5px}.leaflet-control-attribution a{color:var(--am)}
@keyframes pl{50%{box-shadow:0 0 0 8px #e0513a44}}
.lg{z-index:1000;position:absolute;left:8px;bottom:8px;background:var(--pn);border:1px solid var(--ln);padding:3px 8px;font-size:12px;color:var(--mu)}
.nl{max-height:38%;overflow-y:auto;border-top:2px solid var(--am);background:var(--pn)}
.nr{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--ln);cursor:pointer;font-size:13px}
.nr i{width:10px;height:10px;border-radius:50%;flex:none}.nr span{flex:1}.nr small{color:var(--mu)}
nav{display:flex;background:var(--pn);border-top:3px solid var(--am)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mu);font-size:12px;cursor:pointer}nav button.on{color:var(--am);font-weight:700}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{background:var(--pn);border:2px solid var(--am);border-radius:4px;padding:14px;width:100%;max-width:440px;max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
h2{margin:0;font-size:15px;color:var(--am)}.mu{color:var(--mu);margin:0;font-size:13px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
.mbox input[type=text],.mbox select{font:inherit;padding:8px;border:1px solid var(--ln);border-radius:3px;background:var(--bg);color:var(--tx)}
.chip{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--ln)}.chip span{flex:1}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.code{font-size:24px;color:var(--am);text-align:center;border:1px dashed var(--am);padding:8px}
@media(min-width:900px){#app{display:grid;grid-template-columns:290px minmax(0,1fr) 400px}.pane{position:static;display:flex!important;border-right:2px solid var(--ln)}nav,.bk{display:none}}
</style>
</head>
<body>
<header class="top"><div class="logo">⛺ Shelter<small>Rede de sobrevivência</small></div><div class="stats" id="stats"></div><button class="ib" id="setB" aria-label="Configurações">⚙</button></header>
<div class="alert" id="alert" hidden></div>
<div id="app">
 <section class="pane on" id="pl">
  <div class="ph"><b>Conversas</b><button class="sb p" id="newG">＋ Grupo</button><button class="sb" id="joinG">Código</button></div>
  <div class="body" id="rows"></div>
 </section>
 <section class="pane" id="pc">
  <div class="empty" id="pcE">Escolha uma conversa ou crie um grupo.</div>
  <div class="cc" id="pcC" hidden>
   <div class="ph"><button class="ib bk" id="back" aria-label="Voltar">←</button><div id="cAv"></div><div class="who"><b id="cN"></b><small id="cS"></small></div><button class="sb" id="infoB">Info</button></div>
   <div class="msgs" id="msgs"></div>
   <div class="att" id="att" hidden><button class="sb" data-a="loc">📍 Localização</button><button class="sb" data-a="pt">🚩 Ponto de encontro</button><button class="sb" data-a="ok">✔ Estou bem</button><button class="sb" data-a="help">✋ Preciso de ajuda</button><button class="sb" data-a="sos" style="color:var(--er)">❗ SOS</button></div>
   <div class="bar"><button class="sb" id="attB" aria-label="Anexar">＋</button><input type="text" id="inp" placeholder="Mensagem" maxlength="300"><button class="sb mic" id="mic" aria-label="Segure para falar">🎙</button><button class="send" id="snd" aria-label="Enviar">➤</button></div>
  </div>
 </section>
 <section class="pane" id="pm">
  <div class="ph"><b>Mapa da rede</b><button class="sb" id="zi" aria-label="Aproximar">+</button><button class="sb" id="zo" aria-label="Afastar">−</button><button class="sb" id="gps">GPS</button><button class="sb p" id="osm">Ruas</button></div>
  <div class="mapw" id="mapw"><div class="lg" id="lg"></div></div>
  <div class="nl" id="nl"></div>
 </section>
</div>
<nav id="nav"><button data-p="pl" class="on">Conversas</button><button data-p="pc">Chat</button><button data-p="pm">Mapa</button></nav>
<div class="modal" id="mod" hidden><div class="mbox" id="mbox"></div></div>
<script src="leaflet/leaflet.js" onerror="var x=document.createElement('script');x.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';document.head.appendChild(x)"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789',HX='0123456789abcdef';
function rnd(n,al){var s='';for(var i=0;i<n;i++)s+=al[Math.floor(Math.random()*al.length)];return s}
function rr(a){return(Math.random()*2-1)*a}
var K=111320,me={lat:-3.1190,lon:-60.0217,code:'!'+rnd(8,HX)},cosL=Math.cos(me.lat*Math.PI/180),range=3500,sfv='SF9';
var nid=0,gid=0;
function mkNode(name,n,e,code){return{id:'n'+(++nid),name:name,code:code||'!'+rnd(8,HX),lat:me.lat+n/K,lon:me.lon+e/(K*cosL),vx:rr(3),vy:rr(3),st:'ok',seen:Date.now()}}
var nodes=[['Mãe',900,1200],['Pai',-2600,1800],['Vovó',-5200,2600],['Davi',1500,-6800],['Tio Luís',7800,5400]].map(function(a){return mkNode(a[0],a[1],a[2])});
var groups=[{id:'g'+(++gid),name:'Família',code:rnd(6,AL),members:nodes.map(function(n){return n.id})}];
var msgs=[],sup={},cur=null,mg=null,sel=null;
try{var sv=JSON.parse(localStorage.getItem('abrigo')||'null');if(sv){msgs=sv.m||[];sup=sv.s||{};if(sv.g){groups=sv.g;gid=sv.gi}if(sv.n){nodes=sv.n.map(function(o){o.vx=rr(3);o.vy=rr(3);o.st='ok';o.seen=Date.now();return o});nid=sv.ni}if(sv.c)me.code=sv.c}}catch(e){}
function save(){if(real)return;try{localStorage.setItem('abrigo',JSON.stringify({m:msgs.slice(-300).map(function(m){var o={};for(var k in m)if(k!=='u')o[k]=m[k];return o}),s:sup,g:groups,gi:gid,ni:nid,c:me.code,n:nodes.map(function(n){return{id:n.id,name:n.name,code:n.code,lat:n.lat,lon:n.lon}})}))}catch(e){}}
function sys(c,x){msgs.push({c:c,f:'Sistema',x:x,sys:1,t:Date.now(),rd:1})}
if(!msgs.length){var n0=Date.now();msgs=[{c:'dn1',f:'Mãe',x:'Chegou bem?',t:n0-3600000},{c:'g1',f:'Pai',x:'Se a casa não for segura, nos encontramos na ponte velha.',t:n0-1800000},{c:'dn4',f:'Davi',x:'Estou com água e lanterna.',t:n0-900000}];sys('g1','Grupo criado. Código de convite: '+groups[0].code)}
function nodeBy(i){return nodes.filter(function(n){return n.id===i})[0]}
function dist(a,b){if(a.lat==null||b.lat==null)return Infinity;return Math.hypot((a.lat-b.lat)*K,(a.lon-b.lon)*K*cosL)}
function route(to){if(!to)return -1;if(real)return to.num&&Date.now()-to.seen<900000?(to.hops||0)+1:-1;var all=[me].concat(nodes),seen={},q=[[me,0]];seen.me=1;
 while(q.length){var c=q.shift();if(c[0]===to)return c[1];all.forEach(function(n){var k=n===me?'me':n.id;if(!seen[k]&&dist(c[0],n)<=range){seen[k]=1;q.push([n,c[1]+1])}})}return -1}
function rssi(d){return Math.round(-50-25*Math.log10(Math.max(d,100)/100))}
function hhmm(t){return new Date(t).toTimeString().slice(0,5)}
function ago(t){var s=Math.round((Date.now()-t)/1000);return s<60?'agora':s<3600?Math.round(s/60)+' min':Math.round(s/3600)+' h'}
function chats(){return groups.map(function(g){return{id:g.id,name:g.name,g:g}}).concat(nodes.map(function(n){return{id:'d'+n.id,name:n.name,n:n}})).concat([{id:'me',name:'Você (lista)'}])}
function chOf(id){return chats().filter(function(c){return c.id===id})[0]}
function last(id){for(var i=msgs.length-1;i>=0;i--)if(msgs[i].c===id)return msgs[i]}
function unread(id){return msgs.filter(function(m){return m.c===id&&!m.rd&&m.f!=='Eu'}).length}
function av(c){var h=0;for(var i=0;i<c.name.length;i++)h+=c.name.charCodeAt(i);return '<div class="av" style="background:'+(c.g?'#4a5a2a':c.id==='me'?'#5d5d4a':'hsl('+(h*37%360)+',35%,32%)')+'">'+(c.g?'👥':c.id==='me'?'📝':esc(c.name[0]))+'</div>'}
function tk(m){return m.s==='q'?'🕓':m.s==='ok'?'✓✓':m.s==='err'?'⚠':''}
function pane(p){['pl','pc','pm'].forEach(function(s){$(s).classList.toggle('on',s===p)});[].forEach.call($('nav').children,function(b){b.classList.toggle('on',b.dataset.p===p)});if(p==='pm')resize()}
$('nav').onclick=function(e){if(e.target.dataset.p)pane(e.target.dataset.p)};
function drawList(){var rows=chats().map(function(c){return{c:c,l:last(c.id)}}).sort(function(a,b){return(b.l?b.l.t:0)-(a.l?a.l.t:0)});
 $('rows').innerHTML=rows.map(function(r){var u=unread(r.c.id),l=r.l,p=l?(l.loc?'📍 Localização':l.a?'🎙 Áudio '+l.a+' s':l.x||''):'Sem mensagens';
  return '<div class="row'+(cur===r.c.id?' sel':'')+'" tabindex="0" data-c="'+r.c.id+'">'+av(r.c)+'<div class="mid"><div class="t"><b>'+esc(r.c.name)+'</b><small>'+(l?hhmm(l.t):'')+'</small></div><div class="t"><span class="pv">'+(l&&l.f==='Eu'?tk(l)+' ':'')+esc(p)+'</span>'+(u?'<i class="bd">'+u+'</i>':'')+'</div></div></div>'}).join('')}
function setSub(){var c=chOf(cur);if(!c)return;$('cS').textContent=c.g?c.g.members.map(function(i){var n=nodeBy(i);return n?n.name:'?'}).join(', ')||'Sem membros':c.id==='me'?'Só você':(route(c.n)>=0?'● online · '+route(c.n)+' salto(s)':'sem sinal · visto há '+ago(c.n.seen))}
function supCard(){var S=['Água (3 L por pessoa por dia)','Comida para 7 dias','Lanterna e pilhas','Remédios e receitas','Primeiros socorros','Documentos em saco plástico','Power bank carregado','Rádio a pilha'];
 return '<div class="b"><b>Suprimentos da casa</b>'+S.map(function(s,i){return '<label class="chip"><input type="checkbox" data-i="'+i+'"'+(sup[i]?' checked':'')+'><span>'+esc(s)+'</span></label>'}).join('')+'</div>'}
function drawConv(){var c=chOf(cur);if(!c)return;var el=$('msgs'),bot=el.scrollHeight-el.scrollTop-el.clientHeight<40;
 $('pcE').hidden=true;$('pcC').hidden=false;$('cAv').innerHTML=av(c);$('cN').textContent=c.name;setSub();$('infoB').hidden=c.id==='me';
 var h=cur==='me'?supCard():'';
 msgs.forEach(function(m,k){if(m.c!==cur)return;m.rd=1;if(m.sys){h+='<div class="sys">'+esc(m.x)+'</div>';return}var mine=m.f==='Eu';
  h+='<div class="b '+(mine?'o':'')+'">'+(!mine&&c.g?'<small class="sn">'+esc(m.f)+'</small>':'')+(m.loc?'<div class="lc" data-k="'+k+'"><span>'+(m.loc.pt?'🚩':'📍')+'</span><div><b>'+(m.loc.pt?'Ponto de encontro':'Localização')+'</b><small>'+m.loc.lat.toFixed(4)+', '+m.loc.lon.toFixed(4)+'</small></div></div>':'')+(m.a?'<div class="vb"><button data-v="'+k+'" aria-label="Reproduzir">▶</button><span>0:'+('0'+m.a).slice(-2)+(m.u||m.sim?'':' (indisponível)')+'</span></div>':'')+(m.x?'<div>'+esc(m.x)+'</div>':'')+'<small class="mt">'+hhmm(m.t)+(mine?' '+tk(m):'')+'</small></div>'});

 if(to===BC){var g=groups.filter(function(x){return(x.ch||0)===ch})[0];if(!g){g={id:'g'+(++gid),name:'Canal '+ch,code:rnd(6,AL),ch:ch,members:[]};groups.push(g)}if(g.members.indexOf(n.id)<0)g.members.push(n.id);c=g.id}
 else if(to===myNum)c='d'+n.id;else return;
 var loc=null,x=text,mm=/^([📍🚩]) (-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)\s*(.*)$/u.exec(text);
 if(mm){loc={lat:+mm[2],lon:+mm[3]};if(mm[1]==='🚩')loc.pt=1;x=mm[4];if(!loc.pt){n.lat=loc.lat;n.lon=loc.lon}}
 if(/^SOS/i.test(x)){n.st='sos';if(!loc&&n.lat!=null)loc={lat:n.lat,lon:n.lon}}else if(/precis[ao] de ajuda/i.test(x))n.st='help';else if(/^estou bem/i.test(x))n.st='ok';
 msgs.push({c:c,f:n.name,x:x,loc:loc,t:Date.now(),rd:cur===c?1:0})}
function sendRaw(b){var u=new Uint8Array(b);
 if(radio.kind==='usb'){var f=new Uint8Array(4+u.length);f[0]=0x94;f[1]=0xC3;f[2]=u.length>>8;f[3]=u.length&255;f.set(u,4);return radio.wr.write(f)}
 if(radio.kind==='ble')return radio.to.writeValue(u);
 return Promise.reject(new Error('sem rádio'))}
function goReal(){real=true;myNum=0;nodes=[];sel=null;groups.forEach(function(g){g.members=[]});
 if(map){Object.keys(nm).forEach(function(k){map.removeLayer(nm[k])});nm={};links.clearLayers()}
 $('mic').hidden=true;setSt('conectado, sincronizando…');refresh();draw()}
function drop(){real=false;radio={};$('mic').hidden=false;setSt('desconectado');refresh()}
function connectUsb(){if(!navigator.serial)return Promise.reject(new Error('USB serial indisponível neste navegador (use Chrome ou Edge no computador).'));
 return navigator.serial.requestPort().then(function(p){return p.open({baudRate:115200}).then(function(){
  radio={kind:'usb',port:p,wr:p.writable.getWriter()};goReal();
  var rd=p.readable.getReader(),buf=[];
  radio.wr.write(new Uint8Array(32).fill(0xC3)).then(function(){return sendRaw(pV(3,rid()))});
  (function loop(){rd.read().then(function(r){if(r.done){drop();return}
   for(var i=0;i<r.value.length;i++)buf.push(r.value[i]);
   while(buf.length>=4){var st=buf.indexOf(0x94);if(st<0){buf=[];break}if(st>0)buf.splice(0,st);if(buf.length<4)break;if(buf[1]!==0xC3){buf.shift();continue}var l=buf[2]*256+buf[3];if(l>512){buf.shift();continue}if(buf.length<4+l)break;onFrom(new Uint8Array(buf.slice(4,4+l)));buf.splice(0,4+l)}
   loop()}).catch(drop)})()})})}
function connectBle(){if(!navigator.bluetooth)return Promise.reject(new Error('Bluetooth indisponível. Use o Chrome.'));
 var S='6ba1b218-15a8-461f-9fa8-5dcae273eafd',dev;
 return navigator.bluetooth.requestDevice({filters:[{services:[S]}]}).then(function(d){dev=d;d.addEventListener('gattserverdisconnected',drop);return d.gatt.connect()})
 .then(function(g){return g.getPrimaryService(S)})
 .then(function(sv){return Promise.all([sv.getCharacteristic('f75c76d2-129e-4dad-a1dd-7866124401e7'),sv.getCharacteristic('2c55e69e-4993-11ed-b878-0242ac120002'),sv.getCharacteristic('ed9da18c-a800-4f66-a670-aa7547e34453')])})
 .then(function(c){radio={kind:'ble',dev:dev,to:c[0],from:c[1],num:c[2]};goReal();
  function drain(){return radio.from.readValue().then(function(v){var u=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);if(u.length){onFrom(u);return drain()}})}
  var busy=false,again=false;function pump(){if(busy){again=true;return}busy=true;drain().catch(function(){}).then(function(){busy=false;if(again){again=false;pump()}})}
  radio.num.addEventListener('characteristicvaluechanged',pump);
  return radio.num.startNotifications().then(function(){return sendRaw(pV(3,rid()))}).then(pump)})}

setInterval(function(){if(!real)nodes.forEach(function(n){if(n.lat==null||n.vx==null)return;n.lat+=n.vy/K;n.lon+=n.vx/(K*cosL);if(Math.random()<.1){n.vx=rr(4);n.vy=rr(4)}if(route(n)>=0)n.seen=Date.now()});

 var gs=groups.filter(function(g){return g.members.indexOf(n.id)>=0}),c=gs.length&&Math.random()<.5?gs[Math.floor(Math.random()*gs.length)].id:'d'+n.id,
  r=Math.random(),x,loc=null,v=false;
 if(r<.04){x=AT.sos;n.st='sos';loc={lat:n.lat,lon:n.lon}}else if(r<.12){x=AT.help;n.st='help';loc={lat:n.lat,lon:n.lon}}
 else if(n.st!=='ok'&&r<.6){x='Já está tudo bem por aqui.';n.st='ok'}
 else{x=talk[Math.floor(Math.random()*talk.length)];if(Math.random()<.12)loc={lat:n.lat,lon:n.lon};else v=n.st==='ok'&&Math.random()<.12}
 msgs.push({c:c,f:n.name,x:v?'':loc&&!/SOS|ajuda/.test(x)?'':x,loc:loc,a:v?4:0,sim:v?1:0,t:Date.now(),rd:cur===c?1:0});save();refresh()},11000);
upRange();refresh();setTimeout(resize,50);
